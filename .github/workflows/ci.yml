name: Django CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEBUG: "True"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate migrations for CI schema sync
        run: |
          python manage.py makemigrations --noinput

      - name: Apply migrations
        run: |
          python manage.py migrate --noinput || {
            echo "❌ ERROR: Failed to apply migrations"
            exit 1
          }

      - name: Seed stations and related data
        run: |
          python load_ski_stations.py || {
            echo "❌ ERROR: Failed to seed ski stations data"
            exit 1
          }

      - name: Verify migrations are complete
        run: |
          python manage.py migrate --check --noinput || {
            echo "❌ ERROR: Database migrations incomplete"
            exit 1
          }

      - name: Check project
        run: |
          python manage.py check || {
            echo "❌ ERROR: Django system checks failed"
            exit 1
          }

      - name: Run tests
        run: python manage.py test
