name: Django CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: grenobleski_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DEBUG: "True"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/grenobleski_test"
      SECRET_KEY: "test-secret-key-for-ci"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install system dependencies
        run: |
          bash scripts/github-django-ci.sh install-system-deps

      - name: Install dependencies
        run: |
          bash scripts/github-django-ci.sh install-python-deps

      - name: Check for unmigrated model changes
        run: |
          bash scripts/github-django-ci.sh check-unmigrated

      - name: Wait for PostgreSQL to be ready
        run: |
          bash scripts/github-django-ci.sh wait-postgres

      - name: Create test database
        run: |
          bash scripts/github-django-ci.sh recreate-db

      - name: Apply migrations
        run: |
          bash scripts/github-django-ci.sh migrate

      - name: Seed stations and related data
        run: |
          bash scripts/github-django-ci.sh seed

      - name: Verify migrations are complete
        run: |
          bash scripts/github-django-ci.sh verify-migrations

      - name: Show migrations state
        run: |
          python manage.py showmigrations

      - name: Check project
        run: |
          bash scripts/github-django-ci.sh check-project

      - name: Run tests
        run: python manage.py test
