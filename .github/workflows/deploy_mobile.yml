name: Deploy GrenobleSki Android

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    name: Build, Sign & Deploy Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('grenobleski_android_native/**/*.gradle*', 'grenobleski_android_native/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Write Google Play service account JSON
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$PLAY_STORE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"

      - name: Install Python dependencies for Play scripts
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-google-play.txt

      - name: Make scripts executable
        run: |
          chmod +x grenobleski_android_native/gradlew
          chmod +x scripts/deploy_google_play.sh

      - name: Build release APK & AAB
        working-directory: grenobleski_android_native
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEY_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION_NAME: "1.${{ github.run_number }}.0"
        run: |
          ./gradlew assembleRelease --no-daemon
          ./gradlew bundleRelease --no-daemon

      - name: Validate Play deploy preflight
        env:
          GOOGLE_PLAY_VALIDATE_ONLY: "true"
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ runner.temp }}/play-service-account.json
          GOOGLE_PLAY_AAB_PATH: ${{ github.workspace }}/grenobleski_android_native/app/build/outputs/bundle/release/app-release.aab
          ANDROID_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_SIGNING_STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_PACKAGE_NAME: fr.grenobleski.nativeapp
          GOOGLE_PLAY_TRACK: internal
        run: ./scripts/deploy_google_play.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: grenobleski-release-apk-${{ github.run_number }}
          path: grenobleski_android_native/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: grenobleski-release-aab-${{ github.run_number }}
          path: grenobleski_android_native/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Deploy to Google Play Store (Internal Testing)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ runner.temp }}/play-service-account.json
          GOOGLE_PLAY_AAB_PATH: ${{ github.workspace }}/grenobleski_android_native/app/build/outputs/bundle/release/app-release.aab
          GOOGLE_PLAY_PACKAGE_NAME: fr.grenobleski.nativeapp
          GOOGLE_PLAY_TRACK: internal
          GOOGLE_PLAY_RELEASE_STATUS: completed
          GOOGLE_PLAY_ROLLOUT_PERCENTAGE: "100"
          GOOGLE_PLAY_BUILD_NUMBER: ${{ github.run_number }}
          GOOGLE_PLAY_VERSION_NAME: 1.${{ github.run_number }}.0
          GOOGLE_PLAY_CHANGES_NOT_SENT_FOR_REVIEW: "false"
          ANDROID_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_SIGNING_STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./scripts/deploy_google_play.sh

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v1.${{ github.run_number }}.0
          name: "GrenobleSki Android v1.${{ github.run_number }}.0"
          body: |
            Automated release from commit ${{ github.sha }}.
            Built by GitHub Actions run #${{ github.run_number }}.
          files: grenobleski_android_native/app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
